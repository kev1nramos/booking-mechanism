name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Check for build artifacts
        run: |
          test -f packages/core/dist/index.js || exit 1
          test -f packages/server/dist/index.js || exit 1
          echo "✅ All packages built successfully"

  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code (if configured)
        run: pnpm lint || echo "⚠️  No lint script configured"

  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run security audit
        run: pnpm audit --prod || echo "⚠️  Security audit found issues, please review"

      - name: Check for secrets in code
        run: |
          echo "Checking for common secret patterns..."
          ! grep -r "sk-" --include="*.ts" --include="*.js" packages/ || exit 1
          ! grep -r "AKIA" --include="*.ts" --include="*.js" packages/ || exit 1
          ! grep -r "ghp_" --include="*.ts" --include="*.js" packages/ || exit 1
          echo "✅ No obvious secrets detected"

      - name: Check .env files not committed
        run: |
          if find . -name ".env" -not -path "./node_modules/*" | grep -q .; then
            echo "❌ .env file found in repository!"
            exit 1
          fi
          echo "✅ No .env files committed"
